name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create --platforms=android --org ir.parchesarai --project-name anbar_parche build_app

      - name: Copy app code
        run: |
          rm -rf build_app/lib build_app/test
          cp -r lib build_app/lib
          cp -r assets build_app/assets
          cp pubspec.yaml build_app/pubspec.yaml
          python3 tools/patch_android.py build_app

      - name: Build release APK
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release

      # امضای ثابت: باعث می‌شود نسخه‌های بعدی روی نسخه‌ی قبلی نصب شوند و داده‌ها پاک نشوند
      - name: Sign APK with fixed key
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          cp build_app/build/app/outputs/flutter-apk/app-release.apk robofabric.apk
          $APKSIGNER sign --ks keystore/anbar.jks --ks-key-alias anbar \
            --ks-pass pass:anbar1234 --key-pass pass:anbar1234 robofabric.apk
          $APKSIGNER verify robofabric.apk

      - uses: actions/upload-artifact@v4
        with:
          name: robofabric-apk
          path: robofabric.apk

      - name: Publish release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" robofabric.apk \
            --title "نسخه ${{ github.run_number }}" --notes "فایل APK آماده‌ی نصب"
